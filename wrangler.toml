name = "memory-nook"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Serves the frontend from /public as static assets alongside the API
[assets]
directory = "../public"
binding = "ASSETS"

# Workers AI — used for embeddings (semantic search) and generating answers.
# No API key needed; this is built into your Cloudflare account.
[ai]
binding = "AI"

# D1 — stores the actual text of every note you save.
[[d1_databases]]
binding = "DB"
database_name = "memory-nook-db"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Vectorize — stores a "meaning fingerprint" of each note so questions
# can find relevant notes even if they don't share exact words.
[[vectorize]]
binding = "VECTORIZE"
index_name = "memory-nook-index"
